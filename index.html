<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>The Head and the Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: full-height 3D stage on the left, a scripture study panel on the right (stacked on phones). Single night look. */
:root{
  --night:#090d1a;
  --night-2:#121933;
  --panel:#0e1427;
  --fg:#ece8df;
  --muted:#9aa4bd;
  --line:rgba(190,205,240,.12);
  --gold:#f0c674;
  --pearl:#bcd6ff;
  --serif:"Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans:"Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--night)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;pointer-events:none}
.brand{pointer-events:none}
.brand .ref{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.views{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;pointer-events:auto;max-width:360px}
.chip{font:500 12px/1 var(--sans);color:var(--muted);background:rgba(14,20,39,.6);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer;backdrop-filter:blur(6px)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:rgba(236,232,223,.4)}
.modes{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 18px;display:flex;gap:8px;overflow-x:auto;justify-content:center}
.mode{flex:0 0 auto;text-align:left;font-family:var(--sans);color:var(--fg);background:rgba(14,20,39,.7);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s, background .2s}
.mode b{display:block;font-weight:600;font-size:14px}
.mode span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.mode:hover{border-color:rgba(236,232,223,.3)}
.mode[aria-pressed="true"]{background:rgba(30,38,70,.85);border-color:var(--c, rgba(236,232,223,.55));box-shadow:0 0 0 1px var(--c, transparent) inset}
.mode[data-k="head"]{--c:var(--gold)}
.mode[data-k="body"]{--c:var(--pearl)}
.hint{position:absolute;left:20px;bottom:86px;font-size:12px;color:var(--muted);pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:500;letter-spacing:.02em;padding:3px 9px;border-radius:999px;transition:opacity .35s;opacity:0}
.tag.h{color:var(--night);background:var(--gold)}
.tag.b{color:var(--night);background:var(--pearl)}
.tag.base{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--fg);background:none;padding:0;opacity:.9}
.tag.base small{display:block;text-align:center;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tag.arc{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--fg);background:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding-block:28px 40px;padding-left:max(26px, env(safe-area-inset-left,0px));padding-right:max(26px, env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.panel h2{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1;margin:6px 0 4px;text-wrap:balance}
.role{margin:0 0 18px;font-size:14px;color:var(--accent, var(--fg))}
.kjv{margin:0 0 18px;padding:16px 18px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-family:var(--serif);font-size:17px;line-height:1.5}
.kjv p{margin:0}
.kjv p+p{margin-top:8px}
.vn{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--accent, var(--muted));vertical-align:super;margin-right:4px}
.kjv cite{display:block;margin-top:10px;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-style:normal}
.lead{margin:0 0 18px;color:var(--fg)}
.panel h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.points{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.points li{padding-left:14px;border-left:2px solid var(--accent, var(--line))}
.points strong{display:block;font-weight:600}
.points span{color:#c9cdd8}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.pair button{text-align:left;font-family:var(--sans);color:var(--fg);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pair button:hover{border-color:var(--accent, rgba(236,232,223,.35))}
.pair b{display:block;font-family:var(--serif);font-size:17px;font-weight:500}
.pair span{font-size:12px;color:var(--muted)}
.pair em{display:block;font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.support{display:grid;gap:12px}
.support div{font-family:var(--serif);font-size:15px;line-height:1.5;color:#c9cdd8}
.support cite{display:block;font:600 11.5px/1.3 var(--sans);font-style:normal;color:var(--muted);margin-bottom:3px;letter-spacing:.03em}
.passage{font-family:var(--serif);font-size:14.5px;line-height:1.6}
.passage span{color:rgba(236,232,223,.38);transition:color .3s}
.passage span.on{color:var(--fg)}
.passage span.on .vn{color:var(--accent, var(--gold))}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.take{margin-top:22px;padding:16px 18px;border-radius:12px;border:1px solid rgba(240,198,116,.35);font-family:var(--serif);font-size:17px;line-height:1.45}
ol.lessons{margin:0;padding-left:20px;display:grid;gap:8px;color:#c9cdd8}
ol.lessons b{color:var(--fg);font-weight:600}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56% 44%}
  .panel{border-left:0;border-top:1px solid var(--line);padding-block:20px 32px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
  .top{flex-direction:column;padding:14px 16px}
  .brand h1{font-size:24px}
  .views{justify-content:flex-start}
  .modes{justify-content:flex-start;padding:10px 16px 12px}
  .mode{padding:7px 11px}
  .hint{display:none}
  .panel h2{font-size:32px}
}
@media (max-width:420px){.views .chip.opt{display:none}}
</style>
</head>
<body>

<div class="app">
  <section class="stage" id="stage" aria-label="3D figures of the head and the body">
    <div class="labels" id="labels"></div>
    <div class="top">
      <div class="brand">
        <div class="ref">Ephesians 5:21–33 · KJV</div>
        <h1>The Head and the Body</h1>
      </div>
      <div class="views" role="group" aria-label="Viewpoint">
        <button class="chip" data-view="front" aria-pressed="true">Front</button>
        <button class="chip" data-view="left" aria-pressed="false">Husband &amp; Wife</button>
        <button class="chip" data-view="right" aria-pressed="false">Christ &amp; Church</button>
        <button class="chip opt" data-view="three" aria-pressed="false">Turned</button>
        <button class="chip opt" data-view="above" aria-pressed="false">From above</button>
      </div>
    </div>
    <div class="hint">Drag to turn · scroll to zoom · tap a head or a body</div>
    <div class="modes" role="group" aria-label="What to light up">
      <button class="mode" data-k="overview"><b>One to another</b><span>v. 21 · the church</span></button>
      <button class="mode" data-k="head"><b>The Head</b><span>Christ · Husband</span></button>
      <button class="mode" data-k="body"><b>The Body</b><span>Church · Wife</span></button>
      <button class="mode" data-k="oneflesh"><b>One</b><span>vv. 31–32</span></button>
    </div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

/* ---------------- Content ---------------- */
const KJV = {
  21:"Submitting yourselves one to another in the fear of God.",

const GOLD='#f0c674', PEARL='#bcd6ff';

      ["John 17:17","Sanctify them through thy truth: thy word is truth."]

/* ---------------- Panel ---------------- */
const panel = document.getElementById('panel');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(k){
  const d = C[k];
  panel.style.setProperty('--accent', d.accent || '');
  if(!d.accent) panel.style.removeProperty('--accent');
  const quote = d.quote.map(v=>`<p><span class="vn">${v}</span>${esc(KJV[v])}</p>`).join('');
  let h = `<div class="eyebrow">${d.eyebrow}</div><h2>${d.title}</h2><p class="role">${d.role}</p>

  if(d.summary){
    h += `<div class="take">The husband is to love his wife as Christ loved the church, and the wife is to submit to her husband as the church submits to Christ.</div>
    <h3>The passage at a glance</h3>
    <table><thead><tr><th>Verses</th><th>Teaching</th><th>Responsibility</th></tr></thead><tbody>
    <tr><td>21</td><td>Mutual submission</td><td>Submit to one another in the fear of God</td></tr>

    <tr><td>28–30</td><td>The husband's care</td><td>Nourish and cherish his wife as his own body</td></tr>
    <tr><td>31–32</td><td>God's design</td><td>Two become one flesh; marriage pictures Christ and the church</td></tr>
    <tr><td>33</td><td>Conclusion</td><td>Husband loves; wife reverences</td></tr>
    </tbody></table>
    <h3>Five lessons</h3>
    <ol class="lessons">
      <li><b>Marriage is God's institution,</b> founded in Genesis 2:24, before the fall.</li>

      <li><b>Marriage points us to Christ and his church.</b></li>

/* figure shader */
const figVS = `varying vec3 vN; varying vec3 vV; varying float vY;
void main(){ vec4 wp=modelMatrix*vec4(position,1.); vY=wp.y; vN=normalize(normalMatrix*normal);
  vec4 mv=modelViewMatrix*vec4(position,1.); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`;
const figFS = `uniform float uHead,uBody,uTime,uNeck,uHover,uHoverZone,uFade; uniform vec3 uBase,uHeadCol,uBodyCol;
varying vec3 vN; varying vec3 vV; varying float vY;
void main(){
  float f=1.-clamp(abs(dot(normalize(vN),normalize(vV))),0.,1.);
  float rim=pow(f,2.6);
  float zone=smoothstep(uNeck-.035,uNeck+.035,vY);
  float flow=.92+.08*sin(uTime*1.2);
  float hov=uHover*mix(1.-uHoverZone,uHoverZone,zone);
  float g=mix(uBody,uHead,zone)+hov*.22;
  vec3 gc=mix(uBodyCol,uHeadCol,zone);
  vec3 N=normalize(vN), V=normalize(vV);
  vec3 L1=normalize(vec3(-.4,.35,.85)), L2=normalize(vec3(.6,.15,.8));
  float dif=max(dot(N,L1),0.);
  float sp=pow(max(dot(N,normalize(L1+V)),0.),36.);
  float sp2=pow(max(dot(N,normalize(L2+V)),0.),70.);
  vec3 col=uBase*(.03+rim*.6+dif*.22)+gc*g*(.09+rim*.85+dif*.2)*flow+vec3(sp*.3+sp2*.14);
  float a=.05+rim*.4+dif*.1+sp*.25+sp2*.12+g*(.14+rim*.26+dif*.1);
  gl_FragColor=vec4(col*uFade,clamp(a,0.,1.)*uFade);
}`;

const NECK = 1.49;

/* The figure: a pictogram person made solid. Round head floating above a shoulder block,
   arms as separate rounded bars, two leg pillars. Built as a distance field (units: pictogram px, 1px = 6mm). */
const PX=.006;
function bodySDF(x,y,z){
  x/=PX; y/=PX; z/=PX;
  const smin=(a,b,k)=>{ const h=Math.max(k-Math.abs(a-b),0)/k; return Math.min(a,b)-h*h*k*.25; };
  const rbox=(px,py,pz,cx,cy,cz,bx,by,bz,r)=>{
    const qx=Math.abs(px-cx)-bx+r, qy=Math.abs(py-cy)-by+r, qz=Math.abs(pz-cz)-bz+r;
    return Math.hypot(Math.max(qx,0),Math.max(qy,0),Math.max(qz,0))+Math.min(Math.max(qx,Math.max(qy,qz)),0)-r; };
  // body: the 2D pictogram outline at one even thickness (same as the arms), every edge rolled into a half-circle
  const d=outlineDepth(x,y), R=8.5;
  const qa=d+R, qb=Math.abs(z);
  const body=Math.hypot(Math.max(qa,0),qb)+Math.min(Math.max(qa,qb),0)-R;
  // head stays separate: a full sphere
  const head=Math.hypot(x,y-279,z)-25;
  return Math.min(body,head)*PX;
}
/* 2D distance to the pictogram body outline, softened so the inflated surface has no creases */
let _odGrid=null;
const OD={x0:-72,y0:-12,w:145,h:270};
function outlineDepth(x,y){
  if(!_odGrid){
    const rb2=(px,py,cx,cy,bx,by,r)=>{ const qx=Math.abs(px-cx)-bx+r, qy=Math.abs(py-cy)-by+r;
      return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-r; };
    const smin=(a,b,k)=>{ const h=Math.max(k-Math.abs(a-b),0)/k; return Math.min(a,b)-h*h*k*.25; };
    const raw=new Float32Array(OD.w*OD.h);
    for(let j=0;j<OD.h;j++) for(let i=0;i<OD.w;i++){
      const X=Math.abs(OD.x0+i), Y=OD.y0+j;
      let d=rb2(X,Y,0,210,62,32,32);                    // shoulders: large round curve sloping into each arm
      d=smin(d,rb2(X,Y,52,162,10,49,10),5);             // arm hangs from inside the curve, reaching a little lower
      let t=rb2(X,Y,0,183.5,33,58.5,0);                 // torso
      t=smin(t,rb2(X,Y,19,71,14.5,71,14.5),5);          // legs (gap between)
      const slit=rb2(X,Y,37.5,150,4.5,52,4.5);          // slit beside each arm, armpit raised to y≈202
      raw[i+j*OD.w]=Math.max(Math.min(d,t),-slit);
    }
    // three box-blur passes ≈ gaussian, removes the ridge lines inside each part
    let a=raw, b=new Float32Array(raw.length); const r=3;
    for(let pass=0;pass<5;pass++){
      for(let j=0;j<OD.h;j++) for(let i=0;i<OD.w;i++){ let s=0,n=0; for(let k=-r;k<=r;k++){ const ii=i+k; if(ii<0||ii>=OD.w) continue; s+=a[ii+j*OD.w]; n++; } b[i+j*OD.w]=s/n; }
      for(let j=0;j<OD.h;j++) for(let i=0;i<OD.w;i++){ let s=0,n=0; for(let k=-r;k<=r;k++){ const jj=j+k; if(jj<0||jj>=OD.h) continue; s+=b[i+jj*OD.w]; n++; } a[i+j*OD.w]=s/n; }
    }
    _odGrid=a;
  }
  const fx=Math.min(Math.max(x-OD.x0,0),OD.w-1.001), fy=Math.min(Math.max(y-OD.y0,0),OD.h-1.001);
  const i=fx|0, j=fy|0, u=fx-i, v=fy-j, g=_odGrid, W=OD.w;
  return (g[i+j*W]*(1-u)+g[i+1+j*W]*u)*(1-v)+(g[i+(j+1)*W]*(1-u)+g[i+1+(j+1)*W]*u)*v;
}
let _bodyGeo=null;
function bodyGeometry(){
  if(_bodyGeo) return _bodyGeo;
  const R=180, S=.94, CY=.91, size=R, size2=R*R, half=R/2;
  const mc=new MarchingCubes(R,new THREE.MeshBasicMaterial(),false,false,320000);
  const f=mc.field; f.fill(-1000);
  for(let k=0;k<R;k++){ const z=(k-half)/half*S; if(Math.abs(z)>.2) continue;
    for(let j=0;j<R;j++){ const y=(j-half)/half*S+CY;
      for(let i=0;i<R;i++){ const x=(i-half)/half*S; if(Math.abs(x)>.42) continue;
        f[i+j*size+k*size2]=80-bodySDF(x,y,z)*1100; } } }
  mc.isolation=80; mc.update();
  const n=mc.count, g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(mc.positionArray.slice(0,n*3),3));
  g.setAttribute('normal',new THREE.BufferAttribute(mc.normalArray.slice(0,n*3),3));
  g.scale(S,S,S); g.translate(0,CY,0); g.computeBoundingSphere();
  mc.geometry.dispose();
  return _bodyGeo=g;
}

function makeFigure(side, x, rotY){
  const root = new THREE.Group(); root.position.x=x; root.rotation.y=rotY; scene.add(root);
  const uniforms = {
    uTime:shared.uTime, uHead:{value:.2}, uBody:{value:.2}, uNeck:{value:NECK},
    uHover:{value:0}, uHoverZone:{value:0}, uFade:{value:1},
    uBase:{value:new THREE.Color('#a9bce6')}, uHeadCol:{value:new THREE.Color(GOLD)}, uBodyCol:{value:new THREE.Color(PEARL)}
  };
  const mat = new THREE.ShaderMaterial({uniforms, vertexShader:figVS, fragmentShader:figFS, transparent:true, depthWrite:false, depthFunc:THREE.LessEqualDepth});
  const pre = new THREE.MeshBasicMaterial({colorWrite:false, transparent:true, depthWrite:true});
  function add(geo, pos, quat, scale){
    const a=new THREE.Mesh(geo,pre), b=new THREE.Mesh(geo,mat);
    for(const m of [a,b]){ if(pos)m.position.copy(pos); if(quat)m.quaternion.copy(quat); if(scale)m.scale.copy(scale); root.add(m); }
    a.renderOrder=1; b.renderOrder=2; a.userData.side=side; pickables.push(a);
  }
  add(bodyGeometry());
  // floor halo
  const haloMat = new THREE.ShaderMaterial({transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uAmt:{value:.3}, uCol:{value:new THREE.Color('#9fb6ea')}},
    vertexShader:`varying vec2 u; void main(){u=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
    fragmentShader:`uniform float uAmt; uniform vec3 uCol; varying vec2 u; void main(){ float d=length(u-.5)*2.; float ring=smoothstep(.03,0.,abs(d-.78)); float disc=smoothstep(1.,0.,d)*.35; gl_FragColor=vec4(uCol,(ring*.9+disc)*uAmt);} `});
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.2),haloMat); halo.rotation.x=-Math.PI/2; halo.position.y=.002; halo.renderOrder=-3; root.add(halo);
  // union ring: one ring per pair, enclosing head and body together
  const ringMat = new THREE.ShaderMaterial({transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uAmt:{value:0}, uA:{value:new THREE.Color(GOLD)}, uB:{value:new THREE.Color(PEARL)}},
    vertexShader:`varying float vY; void main(){ vY=position.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
    fragmentShader:`uniform float uAmt; uniform vec3 uA,uB; varying float vY; void main(){ gl_FragColor=vec4(mix(uB,uA,smoothstep(1.2,1.75,vY)),uAmt*.85);} `});
  const pts=[]; for(let i=0;i<160;i++){ const a=i/160*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*.6, .92+Math.sin(a)*1.04, -.06)); }
  const ring=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),200,.006,6,true),ringMat); ring.renderOrder=-2; root.add(ring);
  return {root, uniforms, haloMat, ringMat, side};
}

function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,false)[0];

  return {side:hit.object.userData.side, zone: hit.point.y>NECK?'head':'body'};

renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType==='touch') return; hover=pick(e); renderer.domElement.style.cursor=hover?'pointer':''; });
renderer.domElement.addEventListener('pointerleave',()=>{hover=null;});
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null;
  if(moved>6) return;
  const p=pick(e);
  if(!p){ return; }
  const map={L:{head:'husband',body:'wife'},R:{head:'christ',body:'church'}};
  select(map[p.side][p.zone]);
});

/* resize */
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  renderer.setSize(w,h,false); composer.setSize(w,h);
  camera.aspect=w/h;
  camera.fov = w/h < .9 ? 50 : 34;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

/* loop */
const clock=new THREE.Clock();
const ease=(a,b,k)=>a+(b-a)*k;
function tick(){
  const dt=Math.min(clock.getDelta(),.05);
  shared.uTime.value += reduced?0:dt;
  const L=C[current].light, k=1-Math.pow(.004,dt);
  for(const [fig,key] of [[figL,'L'],[figR,'R']]){
    const u=fig.uniforms;
    u.uHead.value=ease(u.uHead.value,L[key][0],k);
    u.uBody.value=ease(u.uBody.value,L[key][1],k);
    const hv = hover && hover.side===key;
    u.uHover.value=ease(u.uHover.value,hv?1:0,k*1.5);
    if(hv) u.uHoverZone.value = hover.zone==='head'?1:0;
    fig.haloMat.uniforms.uAmt.value=.22+.5*Math.max(u.uHead.value,u.uBody.value);
    fig.ringMat.uniforms.uAmt.value=ease(fig.ringMat.uniforms.uAmt.value,L.ring||0,k);
    if(!reduced) fig.root.rotation.y = (key==='L'?.16:-.16) + Math.sin(shared.uTime.value*.4+(key==='L'?0:1.7))*.05;
  }
  arcMat.uniforms.uAmt.value=ease(arcMat.uniforms.uAmt.value,L.arc,k);
  crowdU.uFade.value=ease(crowdU.uFade.value,L.crowd||0,k);
  crowd.visible=crowdU.uFade.value>.01;
  crowd.userData.lines.opacity=crowdU.uFade.value*.22;
  const mainFade = 1-.6*crowdU.uFade.value;
  figL.uniforms.uFade.value=mainFade; figR.uniforms.uFade.value=mainFade;
  motesMat.uniforms.uAmt.value=ease(motesMat.uniforms.uAmt.value,L.motes,k);
  if(tween){
    const tk=1-Math.pow(.02,dt);
    camera.position.lerp(tween.pos,tk); controls.target.lerp(tween.tgt,tk);
    if(camera.position.distanceTo(tween.pos)<.01) tween=null;
  }
  controls.update();
  composer.render();
  placeLabels(stage.clientWidth, stage.clientHeight);
  requestAnimationFrame(tick);
}
tick();
</script>
